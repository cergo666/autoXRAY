http2 on;
server_tokens off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# заголовок subscription-userinfo (трафик/срок) для каждой ссылки подписки; файл ведёт autoxray
map $uri $ax_userinfo {
    include {{NGX_MAP}};
    default "";
}

# объявление в приложении (Happ, v2RayTun): общее или предупреждение пользователю о сроке и трафике
map $uri $ax_announce {
    include {{NGX_ANN}};
}

# одна ссылка https://домен/<токен> на все приложения: формат выбирается по User-Agent.
# Первое совпадение сверху вниз; неизвестное приложение получает список ссылок (его понимают все).
# Совпадение регулярного выражения в map затирает $1, поэтому формат сначала копируется через set,
# а токен в location берётся именованным захватом $axt.
map $http_user_agent $ax_fmt {
    default                                txt;
    "~*hiddify"                            txt;
    "~*(?:happ|v2raytun)"                  json;
    "~*(?:clash|mihomo|stash|koala)"       yaml;
    "~*(?:sing-?box|^sf[aimt]/)"           sing;
    "~*(?:mozilla|opera)"                  html;
}

# лимит устройств: токен подписки + X-HWID приложения. Известные устройства перечислены точно,
# новые у пользователя с исчерпанным лимитом попадают под регулярное выражение и получают 403.
map $uri $ax_tok {
    "~^/([A-Za-z0-9]{20,32})\.(?:json|txt|yaml|sing)$" $1;
    default "";
}
map "$ax_tok:$http_x_hwid" $ax_devdeny {
    include {{NGX_DEV}};
    default 0;
}

# журнал запросов подписки: из него autoxray узнаёт устройства (X-HWID, модель, ОС, приложение)
# IP не записывается: для списка устройств он не нужен. Журнал разбирается и очищается раз в 5 минут (autoxray collect).
log_format autoxray_sub escape=json '{"t":$msec,"u":"$uri","s":$status,"h":"$http_x_hwid",'
                                    '"os":"$http_x_device_os","ver":"$http_x_ver_os","model":"$http_x_device_model","ua":"$http_user_agent"}';

server {
    server_name {{DOMAIN}};
    listen unix:/dev/shm/nginx.sock proxy_protocol;

    set_real_ip_from unix:;
    real_ip_header proxy_protocol;

    server_tokens off;
    access_log off;
    error_log /var/log/nginx/error.log crit;

    root {{WEB}};
    index index.html;

    # одна ссылка для любого приложения: формат по User-Agent (см. map $ax_fmt), браузер получает личную страницу
    location ~ "^/[A-Za-z0-9]{20,32}$" {
        set $axf $ax_fmt;
        rewrite "^/([A-Za-z0-9]{20,32})$" /$1.$axf last;
    }

    # личная страница пользователя (ссылки, QR)
    location ~ "^/[A-Za-z0-9]{20,32}\.html$" {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # подписка (json клиентского конфига)
    location ~ "^/(?<axt>[A-Za-z0-9]{20,32})\.json$" {
        default_type application/json;
        add_header routing "happ:";
        add_header routing-enable 0;
        add_header profile-title "base64:YXV0b1hSQVk=";
        add_header profile-web-page-url "https://{{DOMAIN}}/$axt.html";
        add_header announce $ax_announce;
{{SUPPORT}}        # Happ: пароль на локальный SOCKS/HTTP-прокси, чтобы другие приложения на устройстве не могли им пользоваться
        add_header socks-auth-mode auto;
        add_header http-auth-mode auto;
        add_header subscription-userinfo $ax_userinfo;
        add_header Cache-Control "no-store" always;
        access_log {{SUB_LOG}} autoxray_sub;
        if ($ax_devdeny) {
            return 403;
        }
        try_files $uri =404;
    }

    # универсальная подписка: base64-список ссылок для приложений без поддержки клиентского JSON
    location ~ "^/(?<axt>[A-Za-z0-9]{20,32})\.txt$" {
        default_type text/plain;
        add_header profile-title "base64:YXV0b1hSQVk=";
        add_header profile-web-page-url "https://{{DOMAIN}}/$axt.html";
        add_header announce $ax_announce;
{{SUPPORT}}        # Happ: пароль на локальный SOCKS/HTTP-прокси, чтобы другие приложения на устройстве не могли им пользоваться
        add_header socks-auth-mode auto;
        add_header http-auth-mode auto;
        add_header subscription-userinfo $ax_userinfo;
        add_header Cache-Control "no-store" always;
        access_log {{SUB_LOG}} autoxray_sub;
        if ($ax_devdeny) {
            return 403;
        }
        try_files $uri =404;
    }

    # подписки для Clash/Mihomo (.yaml) и sing-box (.sing)
    location ~ "^/(?<axt>[A-Za-z0-9]{20,32})\.(?:yaml|sing)$" {
        default_type text/yaml;
        add_header profile-update-interval 12;
        add_header profile-title "base64:YXV0b1hSQVk=";
        add_header profile-web-page-url "https://{{DOMAIN}}/$axt.html";
        add_header announce $ax_announce;
{{SUPPORT}}        # Happ: пароль на локальный SOCKS/HTTP-прокси, чтобы другие приложения на устройстве не могли им пользоваться
        add_header socks-auth-mode auto;
        add_header http-auth-mode auto;
        add_header subscription-userinfo $ax_userinfo;
        add_header Cache-Control "no-store" always;
        access_log {{SUB_LOG}} autoxray_sub;
        if ($ax_devdeny) {
            return 403;
        }
        try_files $uri =404;
    }

    # XHTTP endpoint (режим stream-up через gRPC-модуль Nginx с буферами 512k)
    location /{{XHTTP_PATH}} {
        client_max_body_size 0;
        client_body_buffer_size 512k;
        grpc_buffer_size 64k;

        client_body_timeout 120s;
        grpc_read_timeout 180s;
        grpc_send_timeout 180s;
        grpc_socket_keepalive on;

        grpc_set_header Host $host;
        grpc_set_header X-Real-IP $remote_addr;
        grpc_set_header X-Forwarded-For $remote_addr;

        grpc_pass grpc://127.0.0.1:3333;
    }

{{REPORTS}}

    # ответ сайта-маскировки на отправку формы входа
    location = {{AUTH_PATH}} {
        limit_except POST {
            deny all;
        }

        default_type application/json;

        add_header Set-Cookie "X-Auth-Token=$request_id; Path=/; HttpOnly; Secure; SameSite=Lax" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;

        return 401 '{"success":false,"code":"{{AUTH_CODE}}","message":"{{AUTH_MSG}}","request_id":"$request_id"}';
    }

{{FALLBACK}}

    location ~ /\.ht {
        deny all;
    }
}

server {
    listen 80;
    server_name {{DOMAIN}};

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
